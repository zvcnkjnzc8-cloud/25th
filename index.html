<!DOCTYPE html>
<!-- TOYONO 25th Anniversary Special Website -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYONO 25th Anniversary Album 『A Delicadeza do Instante』</title>
    <style>
        :root {
            --bg-color: #F8F7F5;
            --card-bg: #FFFFFF;
            --text-main: #1A1918;
            --text-sub: #55524E;
            --accent-gold: #A37619;
            --accent-cool: #3A3938;
            --border-color: #E2DDD5;
            --shadow-soft: 0 16px 40px rgba(0, 0, 0, 0.04);
            --max-width: 680px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.9;
            letter-spacing: 0.06em;
            padding: 48px 16px 90px;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 100%;
            max-width: var(--max-width);
            text-align: center;
        }

        /* Header / Editorial Design */
        header {
            margin-bottom: 36px;
            padding: 0 10px;
        }

        .main-logo {
            max-width: 180px;
            height: auto;
            margin: 0 auto 18px;
            display: block;
        }

        .badge {
            display: inline-block;
            font-size: 0.76rem;
            letter-spacing: 0.22em;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .title-container {
            margin: 12px 0 20px;
        }

        .main-title {
            font-size: 2.1rem;
            font-weight: 400;
            line-height: 1.35;
            color: var(--text-main);
            letter-spacing: 0.08em;
            font-style: italic;
        }

        .sub-title {
            display: block;
            font-size: 1.05rem;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.18em;
            font-style: normal;
        }

        .catch-group {
            margin-top: 22px;
            border-top: 1px solid var(--border-color);
            padding-top: 18px;
            display: inline-block;
        }

        .catch-main {
            font-size: 0.92rem;
            color: var(--accent-gold);
            font-weight: 600;
            letter-spacing: 0.12em;
            margin-bottom: 4px;
        }

        .catch-sub {
            font-size: 0.88rem;
            color: var(--text-sub);
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 28px 0 36px;
            flex-wrap: wrap;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 9px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.06em;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--text-main);
            color: #FFFFFF;
            border-color: var(--text-main);
        }

        .tab-panel {
            display: none;
            text-align: left;
        }

        .tab-panel.active {
            display: block;
        }

        /* Jacket Card */
        .jacket-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 8px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            margin: 0 auto 32px;
            max-width: 440px;
            text-align: center;
        }

        .jacket-card img {
            width: 100%;
