<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYONO 25th Anniversary Album 『A Delicadeza do Instante』</title>
    <style>
        :root {
            --bg-grad-1: #F8F5F0;
            --bg-grad-2: #EFE8DE;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #2B2927;
            --text-sub: #66605A;
            --accent-gold: #C29B38;
            --accent-gold-dark: #9A771C;
            --accent-dark: #1E1C1A;
            --border-subtle: rgba(194, 155, 56, 0.2);
            --shadow-float: 0 20px 40px rgba(0, 0, 0, 0.06);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.04);
            --max-width: 860px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Hiragino Mincho ProN", "Shippori Mincho", YuMincho, "Times New Roman", Georgia, serif;
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 2.0;
            letter-spacing: 0.06em;
            -webkit-font-smoothing: antialiased;
        }

        /* ヒーローヘッダー */
        header {
            text-align: center;
            padding: 90px 20px 50px;
            position: relative;
        }

        .badge {
            display: inline-block;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.3em;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            position: relative;
            padding: 0 15px;
        }

        .badge::before, .badge::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 20px;
            height: 1px;
            background: var(--accent-gold);
            opacity: 0.5;
        }
        .badge::before { left: -15px; }
        .badge::after { right: -15px; }

        h1 {
            font-size: 2.5rem;
            font-weight: 400;
            line-height: 1.3;
            color: var(--accent-dark);
            margin-bottom: 12px;
        }

        h1 span {
            display: block;
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-top: 10px;
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .catch {
            font-size: 1.05rem;
            color: var(--accent-gold-dark);
            margin-top: 25px;
            font-weight: 400;
            line-height: 1.9;
        }

        /* メインコンテナ */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        /* メインジャケット演出 */
        .jacket-wrap {
            text-align: center;
            margin: 30px auto 50px;
        }

        .jacket-wrap img {
            width: 100%;
            max-width: 440px;
            height: auto;
            border-radius: 6px;
            box-shadow: var(--shadow-float);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .jacket-wrap img:hover {
            transform: translateY(-6px);
        }
