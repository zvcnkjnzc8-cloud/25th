<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYONO 25th Anniversary Album 『A Delicadeza do Instante』</title>
    <style>
        :root {
            --bg-color: #F8F7F5;
            --card-bg: #FFFFFF;
            --text-main: #1A1918;
            --text-sub: #55524E;
            --accent-gold: #B8860B;
            --border-color: #E2DDD5;
            --max-width: 760px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 2.0;
            letter-spacing: 0.06em;
            padding: 24px 12px 100px;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 100%;
            max-width: var(--max-width);
            text-align: center;
        }

        /* HEADER AREA */
        header {
            position: relative;
            margin-bottom: 24px;
            padding: 10px 4px 0;
        }

        .top-logo {
            position: absolute;
            top: 0;
            right: 0;
            width: 110px;
            height: auto;
        }

        .title-image-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 6px 0;
        }

        .title-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* MAIN JACKET PICTURE */
        .jacket-container {
            margin: 0 auto 32px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
            border-radius: 6px;
        }

        .jacket-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        /* ACTION BUTTONS */
        .link-tree {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            text-align: center;
            letter-spacing: 0.08em;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--accent-gold);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* CONTENT SECTIONS */
        section {
            background: var(--card-bg);
            padding: 42px 36px;
            border-radius: 8px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04);
            text-align: left;
        }

        section h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 24px;
            letter-spacing: 0.12em;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        section h3 {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin: 28px 0 12px;
            letter-spacing: 0.08em;
            border-left: 3px solid var(--accent-gold);
            padding-left: 10px;
        }

        p {
            font-size: 0.9rem;
            line-height: 2.0;
            margin-bottom: 18px;
            color: #2C2B2A;
        }

        blockquote {
            margin: 20px 0;
            padding: 22px 24px;
            background: #F9F8F6;
            border-left: 3px solid var(--accent-gold);
            border-radius: 0 4px 4px 0;
            font-size: 0.89rem;
            line-height: 2.0;
        }

        blockquote cite {
            display: block;
            margin-top: 12px;
            font-size: 0.82rem;
            color: var(--text-sub);
            font-style: normal;
            font-weight: 600;
            letter-spacing: 0.06em;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* TABLES & LISTS */
        .spec-table, .credits-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .spec-table th, .spec-table td, .credits-table th, .credits-table td {
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.88rem;
            vertical-align: top;
        }

        .spec-table th, .credits-table th {
            width: 32%;
            color: var(--text-sub);
            font-weight: normal;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .track-list {
            list-style: none;
        }

        .track-list li {
            padding: 13px 0;
            border-bottom: 1px solid #F8F7F5;
            font-size: 0.89rem;
            display: flex;
            align-items: baseline;
        }

        .track-list .num {
            width: 36px;
            font-size: 0.82rem;
            color: var(--accent-gold);
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            margin-bottom: 24px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .vinyl-card {
            display: flex;
            gap: 18px;
            align-items: center;
            background: #F9F8F6;
            padding: 18px;
            border-radius: 6px;
            margin-top: 24px;
            border: 1px solid var(--border-color);
        }

        .vinyl-card img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }

        footer {
            margin-top: 48px;
            font-size: 0.78rem;
            color: #888888;
            letter-spacing: 0.08em;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        @media (max-width: 600px) {
            body { padding: 16px 8px 60px; }
            section { padding: 28px 18px; }
            .top-logo {
                position: static;
                margin: 0 auto 12px;
                display: block;
                width: 95px;
            }
            .spec-table th, .credits-table th { width: 38%; }
            .vinyl-card { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

        <!-- HEADER AREA (p.1) -->
        <header>
            <img src="TOYONO25thLogo.png" alt="TOYONO 25th Logo" class="top-logo" onerror="this.style.display='none';">
            <div class="title-image-container">
                <img src="titleletter.png" alt="A Delicadeza do Instante 瞬間の繊細さ TOYONO" onerror="this.style.display='none';">
            </div>
        </header>

        <!-- MAIN JACKET (p.1) -->
        <div class="jacket
