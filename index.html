<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYONO 25th Anniversary Album 『A Delicadeza do Instante（瞬間の繊細さ）』</title>
    <style>
        :root {
            --bg-color: #FAF8F6;
            --card-bg: #FFFFFF;
            --text-main: #222222;
            --text-sub: #666666;
            --accent-gold: #C59B27;
            --accent-gold-dark: #9A771C;
            --accent-dark: #1F1E1C;
            --border-light: #EFECE6;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 15px 35px rgba(0, 0, 0, 0.08);
            --max-width: 880px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Mincho ProN", "Shippori Mincho", YuMincho, "Times New Roman", Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.9;
            letter-spacing: 0.05em;
            -webkit-font-smoothing: antialiased;
        }

        /* ヘッダー・ヒーロー */
        .hero {
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(180deg, #F2EDE4 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-light);
        }

        .hero .badge {
            display: inline-block;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.25em;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: 2.4rem;
            font-weight: 400;
            line-height: 1.35;
            color: var(--accent-dark);
            margin-bottom: 12px;
        }

        .hero h1 span {
            display: block;
            font-size: 1.25rem;
            color: var(--text-sub);
            margin-top: 8px;
            font-weight: 300;
        }

        .hero p.catch {
            font-size: 1.05rem;
            color: var(--accent-gold-dark);
            margin-top: 24px;
            font-weight: 400;
            line-height: 1.8;
        }

        /* メインコンテナ */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        /* メインジャケット表示 */
        .main-jacket-container {
            text-align: center;
            margin: 40px auto 50px;
        }

        .main-jacket-frame {
            display: inline-block;
            position: relative;
            padding: 12px;
            background: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            box-shadow: var(--shadow-card);
        }

        .main-jacket {
            width: 100%;
            max-width: 460px;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        /* アクションエリア（リンクボタン） */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin: 40px 0 60px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-primary {
            background-color: var(--accent-dark);
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-primary:hover {
            background-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 155, 39, 0.3);
        }

        .btn-secondary {
            background-color: #FFFFFF;
            color: var(--accent-dark);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
        }

        .btn-secondary:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold-dark);
            transform: translateY(-2px);
        }

        /* 各セクション構造 */
        section {
            background: var(--card-bg);
            padding: 48px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
        }

        section h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--accent-dark);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 16px;
            margin-bottom: 28px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: -apple
