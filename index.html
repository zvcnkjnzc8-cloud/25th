<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYONO 25th Anniversary Album 『A Delicadeza do Instante』</title>
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-main: #2C2A29;
            --text-sub: #66625D;
            --accent-gold: #B8860B;
            --border-color: #E8E3DA;
            --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.05);
            --max-width: 680px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Shippori Mincho", YuMincho, serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            letter-spacing: 0.04em;
            padding: 30px 16px 80px;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 100%;
            max-width: var(--max-width);
            text-align: center;
        }

        header {
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            font-size: 0.78rem;
            letter-spacing: 0.25em;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 500;
            line-height: 1.3;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        h1 span {
            display: block;
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 400;
        }

        .catch {
            font-size: 0.95rem;
            color: var(--accent-gold);
            margin-top: 12px;
            font-weight: 500;
            line-height: 1.6;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0 28px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main
