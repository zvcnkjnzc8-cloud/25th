<!DOCTYPE html>
<!-- TOYONO 25th Anniversary Special Website -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYONO 25th Anniversary Album 『A Delicadeza do Instante』</title>
    <style>
        :root {
            --bg-color: #F8F7F5;
            --card-bg: #FFFFFF;
            --text-main: #1A1918;
            --text-sub: #55524E;
            --accent-gold: #A37619;
            --border-color: #E2DDD5;
            --shadow-soft: 0 16px 40px rgba(0, 0, 0, 0.04);
            --shadow-jacket: 0 24px 60px rgba(0, 0, 0, 0.1);
            --max-width: 680px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.9;
            letter-spacing: 0.06em;
            padding: 40px 16px 90px;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 100%;
            max-width: var(--max-width);
            text-align: center;
        }

        /* Header / Title & Logo Area */
        header {
            position: relative;
            margin-bottom: 24px;
            padding: 35px 10px 10px;
        }

        .top-logo {
            position: absolute;
            top: 0;
            right: 0;
            max-width: 120px;
            height: auto;
        }

        .title-image-container {
            max-width: 520px;
            margin: 0 auto;
            padding: 10px 0;
        }

        .title-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Jacket Card (Immersive & Extra Large) */
        .jacket-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-jacket);
            border: 1px solid var(--border-color);
            margin: 0 auto 24px;
            max-width: 620px;
            text-align: center;
        }

        .jacket-card img.jacket-img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }

        /* Navigation Tabs (Right below the jacket) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            flex-wrap: wrap;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 620px;
        }

        .tab-btn {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.06em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--text-main);
            color: #FFFFFF;
            border-color: var(--text-main);
        }

        .tab-panel {
            display: none;
            text-align: left;
        }

        .tab-panel.active {
            display: block;
        }

        /* Buttons & Link Tree */
        .link-tree {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 17px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
            text-align: center;
            letter-spacing: 0.08em;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--accent-gold);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color
